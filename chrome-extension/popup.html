<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }
    .subtitle {
      font-size: 9px;
      color: #9ca3af;
      margin: 0;
    }
    .status-panel {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .recording-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
    }
    .recording-dot.inactive {
      background-color: #4b5563;
    }
    .steps-badge {
      font-size: 16px;
      font-weight: 800;
      color: #e879f9;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-start {
      background: linear-gradient(to right, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
    }
    .btn-start:hover {
      background: linear-gradient(to right, #4f46e5, #7c3aed);
    }
    .btn-pause {
      background-color: #1f2937;
      color: #d1d5db;
      border: 1px solid #374151;
    }
    .btn-pause:hover {
      background-color: #374151;
    }
    .btn-stop {
      background: linear-gradient(to right, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
    }
    .btn-stop:hover {
      background: linear-gradient(to right, #059669, #047857);
    }
    .footer {
      font-size: 8px;
      color: #4b5563;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">M-CLICK</div>
    <div>
      <h1 class="title">By M-Click</h1>
      <p class="subtitle">Modena Automatic Guide Recorder</p>
    </div>
  </div>

  <div class="status-panel">
    <div class="status-text" id="status-display">
      <span class="recording-dot inactive" id="recording-dot"></span>
      <span id="status-label">RECORDER IDLE</span>
    </div>
    <div class="steps-badge" id="steps-count">0 Steps Captured</div>
  </div>

  <div class="actions">
    <button class="btn-start" id="btn-start">
      <span>🔴 Start Recording</span>
    </button>
    
    <button class="btn-pause" id="btn-pause" style="display: none;">
      <span>⏸️ Pause</span>
    </button>

    <button class="btn-stop" id="btn-stop" style="display: none;">
      <span>📥 Stop & Sync to Web App</span>
    </button>
  </div>

  <div class="footer">
    Modena IT Operations • Developer Mode v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
